# A throwaway Postgres for `npm run test:db`. Kept in memory, so stopping it
# throws everything away:
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fasha
      POSTGRES_PASSWORD: fasha
      POSTGRES_DB: fasha_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
